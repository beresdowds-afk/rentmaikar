components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access token.
    cronToken:
      type: apiKey
      in: header
      name: x-cron-token
      description: Shared CRON_SECRET used by pg_cron-triggered workers.
    providerSignature:
      type: apiKey
      in: header
      name: x-signature
      description: Provider HMAC signature over the raw body. Header name varies by provider (Sent, Resend,
        Termii, Persona, Paystack, PayPal, OPay, Twilio).
  responses:
    BadRequest:
      description: Invalid request payload
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content: *id001
    ServerError:
      description: Unhandled server error
      content: *id001
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    CpaasSendRequest:
      type: object
      required:
      - to
      - channel
      properties:
        to:
          type: array
          items:
            type: string
          description: E.164 destinations
        channel:
          type: string
          enum:
          - sms
          - whatsapp
          - rcs
        text:
          type: string
        template:
          type: object
          properties:
            id:
              type: string
            parameters:
              type: object
              additionalProperties: true
        sender_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
