openapi: 3.1.0
info:
  title: Rentmaikar Backend API
  version: 1.0.0
  description: 'Complete server-side surface of the Rentmaikar platform: the Express API gateway and all
    160 Supabase Edge Functions.


    Two hosts are served by this spec. Gateway paths (`/api/...`) are served from `https://staging.rentmaikar.com`.
    Edge function paths (`/functions/v1/...`) are served from `https://bwvocmhcledbwqlpcswp.supabase.co`.


    Most edge functions run with the platform''s `verify_jwt` disabled and validate the caller''s Supabase
    JWT in code. Webhook endpoints authenticate by provider HMAC signature over the raw request body.
    Scheduled workers authenticate with the shared `CRON_SECRET` token.


    No credential values appear in this document.'
  contact:
    name: Rentmaikar / INTE-GRITTY LLC
    url: https://rentmaikar.com
  license:
    name: Proprietary - INTE-GRITTY LLC
    url: https://rentmaikar.com/terms
servers:
- url: https://staging.rentmaikar.com
  description: API gateway (Express)
- url: https://bwvocmhcledbwqlpcswp.supabase.co
  description: Supabase Edge Functions host
tags:
- name: Gateway
  description: Express API gateway routes served from the backend host.
- name: Webhooks
  description: Provider callbacks verified by HMAC signature over the raw body.
- name: AI & Media (ElevenLabs, Lovable AI)
  description: Text-to-speech, speech-to-text, voice listings and agent tokens.
- name: Admin & Platform Operations
  description: Region build-out, vehicle sync, document generation and internal reconciliation.
- name: Auth, Identity & Verification
  description: Sign-in, phone/email verification, referees, API keys and user administration.
- name: Email
  description: Resend delivery, queue processing, inbound routing, suppression and unsubscribe handling.
- name: IoT, Telemetry & Tracking
  description: Hologram SIMs, Traccar/GPSANDTRACK GPS, EMQX MQTT ingestion and provisioning workers.
- name: 'Messaging: SMS / WhatsApp / CPaaS'
  description: Sent.dm-first SMS/WhatsApp dispatch with Twilio and Termii fallbacks, inbound handling
    and DLQ replay.
- name: Notifications, Tasks & Scheduling
  description: Event fan-out, push notifications, reminders and generated admin tasks.
- name: Other / Uncategorised
  description: Endpoints not yet assigned to a domain group.
- name: Payments & Payouts
  description: PayPal, Paystack and OPay charges, payouts, subscriptions and reconciliation.
- name: Persona KYC
  description: Persona identity-verification inquiries, templates, reconciliation and expiry scans.
- name: VoIP, IVR & Call Center
  description: Twilio voice sessions, browser softphone tokens, IVR flows, recordings and call queue.
paths:
  /api/health:
    get:
      tags:
      - Gateway
      operationId: get_api_health
      summary: Gateway liveness
      description: Status, service name, version, uptime and environment.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/health/diagnostics:
