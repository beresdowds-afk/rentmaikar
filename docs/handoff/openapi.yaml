  /api/cpaas/send:
    post:
      tags:
      - Gateway
      operationId: post_api_cpaas_send
      summary: Send an SMS/WhatsApp/RCS message
      description: Dispatches through Sent.dm first, falling back to Twilio (USA voice-approved account)
        or Termii (Nigeria).
      security:
      - supabaseJwt: []
      responses:
        '200':
          description: Success
